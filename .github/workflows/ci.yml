name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build helper
        run: bun run build:helper

      - name: Smoke test helper
        run: node packages/helper/dist/index.js help

      - name: Check helper package
        working-directory: packages/helper
        run: npm pack --dry-run

      - name: Build OpenCode plugin
        run: bun run build:opencode

      - name: Check OpenCode plugin package
        working-directory: packages/opencode
        run: npm pack --dry-run
